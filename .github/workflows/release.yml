name: Release

# Builds and tests every release artifact: the imgquant binaries, the Python wheels and sdist,
# and the npm package tarball. Nothing is published unless the run is started from a v* tag
# with "publish" ticked (Actions > Release > Run workflow > Use workflow from: Tags > v3.0.0).
# Then it creates the GitHub Release (binaries, SHA256SUMS, notes from CHANGELOG.md) and
# uploads the wheels and the sdist to PyPI by trusted publishing (no token).
#
# crates.io and npm are published by hand for 3.0.0 (see RELEASING.md): both registries
# need the package to exist before trusted publishing can be set up for it.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the GitHub Release and the PyPI package (start the run from the v* tag)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Version, release notes, licenses
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that every package has one version (and the tag, when publishing)
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          fail() { echo "::error::$1"; exit 1; }
          for f in cli/Cargo.toml capi/Cargo.toml wasm/Cargo.toml python/Cargo.toml; do
            v=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$f" | head -n 1)
            [ "$v" = "$version" ] || fail "$f has version $v, Cargo.toml $version"
          done
          v=$(jq -r .version wasm/npm/package.json)
          [ "$v" = "$version" ] || fail "wasm/npm/package.json has version $v, Cargo.toml $version"
          grep -q "LIQ_VERSION_STRING \"$version\"" capi/assets/libimgquant.h ||
            fail "capi/assets/libimgquant.h: LIQ_VERSION_STRING is not $version"
          if [ "$PUBLISH" = true ]; then
            [ "$REF_TYPE" = tag ] && [ "$REF_NAME" = "v$version" ] ||
              fail "publishing needs a run started from the tag v$version, not $REF_TYPE $REF_NAME"
            if grep -n -E "^## $version .*unreleased|TODO\(release\)" CHANGELOG.md; then
              fail "CHANGELOG.md: set the release date of $version"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir meta
          {
            echo "## Install"
            echo
            echo "- **Command-line tool:** an archive below, \`cargo binstall imgquant\` or \`cargo install imgquant\`"
            echo "- **Rust:** \`cargo add libimgquant\`"
            echo "- **Python:** \`pip install libimgquant\`"
            echo "- **npm:** \`npm install libimgquant\`"
            echo "- **C:** \`libimgquant-capi\` with cargo-c, see the README"
            echo
            awk -v v="$VERSION" '/^## / { if (found) exit; if ($2 == v) found = 1; next } found' CHANGELOG.md
          } > meta/notes.md
          grep -q '^### ' meta/notes.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: Third-party licenses of the imgquant binary
        # Every crate compiled in on any target, as for the npm package and the wheels.
        run: scripts/third-party-licenses.sh cli/Cargo.toml all imgquant > meta/THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@v7
        with:
          name: meta
          path: meta
          if-no-files-found: error

  cli:
    name: imgquant ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      # The workspace's release profile keeps line tables (debug = 1); release binaries don't.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      # No dependency on the Visual C++ runtime DLLs
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p imgquant --target ${{ matrix.target }}
      - name: Test (tests/cli.rs runs the binary that was just built)
        run: cargo test --release --locked -p imgquant --target ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: meta
          path: meta
      - name: Archive
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        # imgquant-<target>-v<version>/ inside imgquant-<target>-v<version>.tar.gz (.zip on
        # Windows): the names cargo-binstall tries first, so it needs no metadata.
        run: |
          name=imgquant-$TARGET-v$VERSION
          mkdir "$name"
          cp LICENSE NOTICE CHANGELOG.md meta/THIRD-PARTY-LICENSES.txt "$name/"
          # the Linux builds link musl statically, so they carry its notice too
          case $TARGET in
            *-linux-musl) { echo; cat scripts/musl-COPYRIGHT.txt; } >> "$name/THIRD-PARTY-LICENSES.txt" ;;
          esac
          cp cli/README.md "$name/README.md"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/imgquant.exe" "$name/"
            7z a -tzip "$name.zip" "$name"
          else
            cp "target/$TARGET/release/imgquant" "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            imgquant-*.tar.gz
            imgquant-*.zip
          if-no-files-found: error

  wheels:
    # One abi3 wheel (CPython 3.9+) per platform. manylinux2014 needs glibc 2.17 or later,
    # musllinux_1_2 musl 1.2 or later (Alpine 3.13+).
    name: Wheel ${{ matrix.os }} ${{ matrix.target }} ${{ matrix.manylinux }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2014" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2014" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: windows-latest, target: x64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # Linux wheels build in the manylinux or musllinux container; maturin's version comes from
      # the build-system requirement in python/pyproject.toml.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --manifest-path python/Cargo.toml
      - name: Install the wheel and run pytest
        if: matrix.manylinux != 'musllinux_1_2'
        shell: bash
        run: |
          python -m venv .venv-test
          py=.venv-test/bin/python
          [ "$RUNNER_OS" != Windows ] || py=.venv-test/Scripts/python
          "$py" -m pip install --no-index --find-links dist "libimgquant==$VERSION"
          "$py" -m pip install pytest Pillow numpy
          cd python/tests && "../../$py" -m pytest -q
      - name: Install the wheel and run pytest (Alpine)
        if: matrix.manylinux == 'musllinux_1_2'
        run: |
          docker run --rm -e VERSION -v "$PWD:/io" -w /io python:3.15-alpine sh -euc '
            python -m venv /venv
            /venv/bin/pip install --no-index --find-links dist "libimgquant==$VERSION"
            /venv/bin/pip install pytest Pillow numpy
            cd python/tests && /venv/bin/python -m pytest -q'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}-${{ matrix.manylinux || runner.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Python sdist
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Build a wheel from the sdist (what pip does on platforms without a wheel)
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/from-sdist" dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  npm:
    # Builds and tests the npm tarball. 3.0.0 is published from wasm/pkg by hand.
    name: npm package
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wbg
        run: echo "version=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wbg.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build
        run: ./build.sh
      - name: Test
        run: node --test tests/package.test.mjs
      - name: npm pack
        working-directory: wasm/pkg
        run: |
          mkdir "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

  github-release:
    name: GitHub Release
    if: inputs.publish
    needs: [check, cli, wheels, sdist, npm]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: meta
          path: meta
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum imgquant-* | tee SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-path: dist/imgquant-*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "libimgquant $VERSION" --notes-file meta/notes.md

  pypi:
    name: Publish to PyPI
    if: inputs.publish
    needs: [check, cli, wheels, sdist, npm]
    runs-on: ubuntu-latest
    # The PyPI trusted publisher names this workflow file and this environment.
    environment:
      name: release
      url: https://pypi.org/project/libimgquant/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write # trusted publishing; also signs the PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

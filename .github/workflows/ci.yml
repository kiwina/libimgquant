name: CI

# Runs only when started by hand (Actions tab > CI > Run workflow, or `gh workflow run ci.yml`),
# to save Actions minutes on this private repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the workspace
        run: cargo test --workspace --locked
      - name: Test the library without default features (single-threaded)
        run: cargo test -p libimgquant --no-default-features --locked
      - name: Test the C API without default features
        run: cargo test -p libimgquant-capi --no-default-features --locked
      - name: Test the library with only the png feature
        run: cargo test -p libimgquant --no-default-features --features png --locked

  msrv:
    # The library and the C API keep MSRV 1.85; tools/iqeval needs 1.89 and is not built here.
    name: MSRV 1.85 (library, C API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Test the library and the C API
        run: cargo test -p libimgquant -p libimgquant-capi --locked
      - name: Build the library without default features
        run: cargo build -p libimgquant --no-default-features --locked

  lint:
    name: Clippy and rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: Clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (library without default features)
        run: cargo clippy -p libimgquant --all-targets --no-default-features --locked -- -D warnings
      - name: Clippy (library, all features and png only)
        run: |
          cargo clippy -p libimgquant --all-targets --all-features --locked -- -D warnings
          cargo clippy -p libimgquant --all-targets --no-default-features --features png --locked -- -D warnings
      - name: rustfmt and clippy (wasm/ and python/, separate workspaces)
        run: |
          for dir in wasm python; do
            (cd "$dir" && cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings)
          done

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps --all-features -p libimgquant -p libimgquant-capi --locked

  package:
    # Builds the .crate files the way `cargo publish` would, from the packaged sources only.
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo package
        run: cargo package --workspace --exclude iqeval --locked
      - name: List the package contents
        run: |
          cargo package --list -p libimgquant --locked
          cargo package --list -p libimgquant-capi --locked
          ls -l target/package/*.crate

  capi:
    # No C sources live in the repository: the header is checked through stdin.
    name: C API header (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the release library
        run: cargo build --release -p libimgquant-capi --locked
      - name: Check the header as C99
        run: echo '#include "libimgquant.h"' | cc -std=c99 -Wall -Wextra -pedantic -Werror -x c -fsyntax-only -I capi/assets -
      - name: Check the header as C++17
        run: echo '#include "libimgquant.h"' | c++ -std=c++17 -Wall -Wextra -pedantic -Werror -x c++ -fsyntax-only -I capi/assets -
      - name: List the built libraries
        run: ls -l target/release/ | grep -i imgquant

  cargo-c:
    # Checks the [package.metadata.capi] settings: cargo cinstall into a temporary prefix, then
    # compile and run a tiny program (from stdin) against the installed pkg-config file.
    name: cargo-c install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-c
      - name: cargo cinstall
        run: cargo cinstall --release -p libimgquant-capi --locked --prefix="$RUNNER_TEMP/prefix" --libdir=lib
      - name: Show the installed files
        run: find "$RUNNER_TEMP/prefix" \( -type f -o -type l \) | sort
      - name: Build and run a program against the installed library
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/prefix/lib/pkgconfig"
          pkg-config --cflags --libs libimgquant
          printf '%s\n' \
            '#include <libimgquant.h>' \
            '#include <stdio.h>' \
            'int main(void) {' \
            '    liq_attr *attr = liq_attr_create();' \
            '    if (!attr) return 1;' \
            '    printf("libimgquant %d\n", liq_version());' \
            '    liq_attr_destroy(attr);' \
            '    return liq_version() == LIQ_VERSION ? 0 : 1;' \
            '}' \
            | cc -std=c99 -Wall -Werror -x c - $(pkg-config --cflags --libs libimgquant) -o "$RUNNER_TEMP/smoke"
          LD_LIBRARY_PATH="$RUNNER_TEMP/prefix/lib" "$RUNNER_TEMP/smoke"

  wasm:
    # The npm package `libimgquant` (wasm/): native option tests, the wasm32 build with the
    # wasm-bindgen CLI pinned to wasm/Cargo.lock, and Node tests of the built package.
    name: WebAssembly / npm package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wbg
        run: echo "version=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wbg.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Clippy for wasm32
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Rust tests (option parsing, native)
        run: cargo test --locked
      - name: Build the npm package
        run: ./build.sh
      - name: Node 24 tests
        run: node --test tests/package.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Node 18 tests (oldest supported)
        run: node --test tests/package.test.mjs
      - name: npm pack (dry run)
        run: npm pack --dry-run
        working-directory: wasm/pkg

  python:
    # The Python package `libimgquant` (python/, its own Cargo workspace): builds the abi3 wheel
    # and runs pytest against the installed wheel, on the oldest and newest supported Python.
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Build the abi3 wheel
        run: uvx maturin build --release --locked --out dist
      - name: Install the wheel into a fresh venv
        run: |
          uv venv --python "$(python -c 'import sys; print(sys.executable)')" .venv
          uv pip install --python .venv dist/*.whl pytest Pillow numpy
      - name: pytest
        working-directory: python/tests
        run: uv run --no-project --python ../.venv python -m pytest -q
      - name: Build the sdist
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uvx maturin sdist --out dist

  licenses:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # A new advisory against a dependency should not block unrelated changes.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
      # wasm/ and python/ are separate workspaces with their own lockfiles
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          manifest-path: wasm/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          manifest-path: python/Cargo.toml
